# Paths are supplied through SD_PATH and TRAIN_DATA. Run from the repository root.
model: adabridge_sr_512
seed: 123
sd_path: ${oc.env:SD_PATH}
fixed_prompt: ''
fixed_prompt_path: null
dataset_txt_or_dir_paths:
- ${oc.env:TRAIN_DATA}
vae_lora_rank: 16
unet_lora_rank: 32
dinov3_convnext_size: large
lambda_LRR: 5
lambda_Dv3D: 5
lambda_L1: 0.5
lambda_GAN: 0.5
output_dir: outputs/train
timestep_sequence:
- 400
- 300
- 200
- 100
bridge_sigma: 0.005
scheduled_sampling_ratio_min: 0.5
scheduled_sampling_ratio_max: 1.0
scheduled_sampling_start_step: 1
enable_trajectory_control: true
enable_power_modulation: true
enable_sigma_eff_supervision: true
lambda_sigma_eff_supervision: 1.0
enable_sigma_map_modulation: true
enable_sigma_map_supervision: true
lambda_sigma_map_supervision: 1.0
power_min: 0.5
power_max: 1.5
power_ema_beta: 0.99
power_ema_warmup_steps: 100
control_base_channels: 64
control_num_res_blocks: 4
resolution: 512
train_batch_size: 1
max_train_steps: 8000
checkpointing_steps: 1000
save_img_steps: 100
init_from_checkpoint: null
gradient_accumulation_steps: 4
gradient_checkpointing: false
enable_xformers_memory_efficient_attention: false
learning_rate: 5.0e-05
lr_scheduler: constant
lr_warmup_steps: 500
lr_num_cycles: 1
lr_power: 1.0
dataloader_num_workers: 8
use_8bit_adam: false
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.0001
adam_epsilon: 1.0e-08
max_grad_norm: 1.0
logging_dir: logs
allow_tf32: false
mixed_precision: bf16
